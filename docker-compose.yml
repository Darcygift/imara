version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: imara_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-imara_db}
      MYSQL_USER: ${DB_USER:-imara_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imara_app
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-imara_user}:${DB_PASSWORD:-secure_password_change_me}@mysql:3306/${DB_NAME:-imara_db}
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  mysql_data:
    driver: local
