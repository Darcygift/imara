version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart_rent_db
    environment:
      POSTGRES_USER: ${DB_USER:-smart_rent_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-smart_rent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smart_rent_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend + Express Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_rent_app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-smart_rent_user}:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/${DB_NAME:-smart_rent_db}
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./lib:/app/lib

  # Redis (optional, for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: smart_rent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
